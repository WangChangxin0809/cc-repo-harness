</style><rect class="bg" width="100%" height="100%"/><text x="70" y="70" class="txt title">Your model. Your project. One development workflow.</text><text x="70" y="105" class="txt small muted">CC Switch selects the provider; Claude Code runs the harness; the repository keeps knowledge, checks, and learning.</text><rect x="70" y="180" width="260" height="110" class="accent" rx="16"/><text x="90" y="215" class="txt label">CC Switch</text><text x="90" y="242" class="txt small muted">Provider + model selection</text><rect x="400" y="180" width="260" height="110" class="box" rx="16"/><text x="420" y="215" class="txt label">Claude Code</text><text x="420" y="242" class="txt small muted">Agent loop + tools</text><rect x="730" y="180" width="300" height="110" class="accent" rx="16"/><text x="750" y="215" class="txt label">cc-repo-harness</text><text x="750" y="242" class="txt small muted">Repository-side workflow</text><path d="M330 235 L400 235" class="edge"/><text x="365" y="225" text-anchor="middle" class="txt small muted">configure</text><path d="M660 235 L730 235" class="edge"/><text x="695" y="225" text-anchor="middle" class="txt small muted">run</text><rect x="120" y="410" width="250" height="115" class="box" rx="16"/><text x="140" y="445" class="txt label">Project knowledge</text><text x="140" y="472" class="txt small muted">docs · scoped instructions</text><rect x="410" y="410" width="250" height="115" class="box" rx="16"/><text x="430" y="445" class="txt label">Action guards</text><text x="430" y="472" class="txt small muted">before risky operations</text><rect x="700" y="410" width="250" height="115" class="box" rx="16"/><text x="720" y="445" class="txt label">Validation gates</text><text x="720" y="472" class="txt small muted">tests · CI · selftests</text><rect x="990" y="410" width="250" height="115" class="box" rx="16"/><text x="1010" y="445" class="txt label">Assessment</text><text x="1010" y="472" class="txt small muted">/assess → prioritized evidence</text><path d="M880 290 L245 410" class="edge"/><path d="M880 290 L535 410" class="edge"/><path d="M880 290 L825 410" class="edge"/><path d="M880 290 L1115 410" class="edge"/><rect x="460" y="640" width="330" height="110" class="preview" rx="16"/><text x="480" y="675" class="txt label">Experience wiki</text><text x="480" y="702" class="txt small muted">/learn records recurring patterns</text><rect x="900" y="640" width="330" height="110" class="preview" rx="16"/><text x="920" y="675" class="txt label">Skill evolution</text><text x="920" y="702" class="txt small muted">validate improvements before adoption</text><path d="M790 695 L900 695" class="edge"/><text x="845" y="685" text-anchor="middle" class="txt small muted">propose</text></svg>