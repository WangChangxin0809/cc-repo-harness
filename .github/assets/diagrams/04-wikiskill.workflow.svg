<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-label="WikiSkill: experience to validated skills"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#618c9d"/></marker></defs><style>
:root{color-scheme:light dark}.bg{fill:#f7fbfd}.box{fill:#fff;stroke:#6ca6b9;stroke-width:2}.accent{fill:#e8f8f2;stroke:#26906e;stroke-width:2}.warn{fill:#fff6e6;stroke:#c98a19;stroke-width:2}.preview{fill:#f4efff;stroke:#7b61c7;stroke-width:2}.txt{fill:#183848;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.muted{fill:#567988}.edge{stroke:#618c9d;stroke-width:2.2;fill:none;marker-end:url(#a)}@media(prefers-color-scheme:dark){.bg{fill:#06131f}.box{fill:#0b2233;stroke:#34799a}.accent{fill:#0d2e2a;stroke:#69dfbd}.warn{fill:#332812;stroke:#ffd166}.preview{fill:#241d3c;stroke:#b4a8ff}.txt{fill:#e3f6ff}.muted{fill:#91b8ca}.edge{stroke:#78a3b7}}</style><rect class="bg" width="100%" height="100%"/><text x="70" y="70" class="txt title">WikiSkill: experience to validated skills</text><text x="70" y="105" class="txt small muted">Experience is retained even when a candidate skill is rejected; only strict validation improvement is accepted.</text><rect x="60" y="280" width="210" height="100" class="box" rx="16"/><text x="80" y="315" class="txt label">Session traces</text><text x="80" y="342" class="txt small muted">tool calls + outcomes</text><rect x="310" y="280" width="210" height="100" class="preview" rx="16"/><text x="330" y="315" class="txt label">Experience wiki</text><text x="330" y="342" class="txt small muted">distill recurring evidence</text><rect x="560" y="280" width="210" height="100" class="preview" rx="16"/><text x="580" y="315" class="txt label">Candidate skill</text><text x="580" y="342" class="txt small muted">full skill content</text><rect x="810" y="280" width="210" height="100" class="box" rx="16"/><text x="830" y="315" class="txt label">Validation set</text><text x="830" y="342" class="txt small muted">compare to best</text><rect x="1080" y="200" width="210" height="100" class="accent" rx="16"/><text x="1100" y="235" class="txt label">Accept</text><text x="1100" y="262" class="txt small muted">strictly better</text><rect x="1080" y="390" width="210" height="100" class="warn" rx="16"/><text x="1100" y="425" class="txt label">Rollback</text><text x="1100" y="452" class="txt small muted">tie or worse</text><path d="M270 330 L310 330" class="edge"/><path d="M520 330 L560 330" class="edge"/><path d="M770 330 L810 330" class="edge"/><path d="M1020 330 L1080 250" class="edge"/><text x="1050" y="280" text-anchor="middle" class="txt small muted">better</text><path d="M1020 330 L1080 440" class="edge"/><text x="1050" y="375" text-anchor="middle" class="txt small muted">tie / worse</text><rect x="530" y="590" width="420" height="100" class="accent" rx="16"/><text x="550" y="625" class="txt label">History survives rollback</text><text x="550" y="652" class="txt small muted">wiki evidence + candidate diff + result stay recorded</text><path d="M1185 490 L740 590" class="edge"/><text x="962" y="530" text-anchor="middle" class="txt small muted">retain evidence</text></svg>