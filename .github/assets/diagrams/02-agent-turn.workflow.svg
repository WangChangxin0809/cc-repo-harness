<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-label="One task, supported from context to delivery"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#618c9d"/></marker></defs><style>
:root{color-scheme:light dark}.bg{fill:#f7fbfd}.box{fill:#fff;stroke:#6ca6b9;stroke-width:2}.accent{fill:#e8f8f2;stroke:#26906e;stroke-width:2}.preview{fill:#f4efff;stroke:#7b61c7;stroke-width:2}.txt{fill:#183848;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.muted{fill:#567988}.edge{stroke:#618c9d;stroke-width:2.2;fill:none;marker-end:url(#a)}@media(prefers-color-scheme:dark){.bg{fill:#06131f}.box{fill:#0b2233;stroke:#34799a}.accent{fill:#0d2e2a;stroke:#69dfbd}.preview{fill:#241d3c;stroke:#b4a8ff}.txt{fill:#e3f6ff}.muted{fill:#91b8ca}.edge{stroke:#78a3b7}}</style><rect class="bg" width="100%" height="100%"/><text x="70" y="70" class="txt title">One task, supported from context to delivery</text><text x="70" y="105" class="txt small muted">Context arrives when needed, actions are checked, edits are verified, and evidence is delivered.</text><rect x="70" y="300" width="190" height="110" class="box" rx="16"/><text x="90" y="335" class="txt label">Task</text><text x="90" y="362" class="txt small muted">goal</text><rect x="300" y="300" width="190" height="110" class="accent" rx="16"/><text x="320" y="335" class="txt label">Context</text><text x="320" y="362" class="txt small muted">read docs</text><rect x="530" y="300" width="190" height="110" class="box" rx="16"/><text x="550" y="335" class="txt label">Guard</text><text x="550" y="362" class="txt small muted">check action</text><rect x="760" y="300" width="190" height="110" class="box" rx="16"/><text x="780" y="335" class="txt label">Edit</text><text x="780" y="362" class="txt small muted">change code</text><rect x="990" y="300" width="190" height="110" class="accent" rx="16"/><text x="1010" y="335" class="txt label">Verify</text><text x="1010" y="362" class="txt small muted">tests + gates</text><rect x="1220" y="300" width="190" height="110" class="box" rx="16"/><text x="1240" y="335" class="txt label">Deliver</text><text x="1240" y="362" class="txt small muted">evidence</text><path d="M260 355 L300 355" class="edge"/><path d="M490 355 L530 355" class="edge"/><path d="M720 355 L760 355" class="edge"/><path d="M950 355 L990 355" class="edge"/><path d="M1180 355 L1220 355" class="edge"/><rect x="260" y="560" width="330" height="95" class="box" rx="16"/><text x="280" y="595" class="txt label">Scoped knowledge</text><text x="280" y="622" class="txt small muted">Only relevant docs are pulled</text><rect x="710" y="560" width="330" height="95" class="box" rx="16"/><text x="730" y="595" class="txt label">Failure feedback</text><text x="730" y="622" class="txt small muted">A red check returns to the work</text><rect x="1110" y="560" width="300" height="95" class="preview" rx="16"/><text x="1130" y="595" class="txt label">Session trace</text><text x="1130" y="622" class="txt small muted">Feeds later learning</text><path d="M425 560 L395 410" class="edge"/><path d="M875 560 L855 410" class="edge"/><path d="M1310 560 L1315 410" class="edge"/></svg>