<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-label="AgentRoom: shared work for parallel agents"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#618c9d"/></marker></defs><style>
:root{color-scheme:light dark}.bg{fill:#f7fbfd}.box{fill:#fff;stroke:#6ca6b9;stroke-width:2}.accent{fill:#e8f8f2;stroke:#26906e;stroke-width:2}.preview{fill:#f4efff;stroke:#7b61c7;stroke-width:2}.txt{fill:#183848;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.muted{fill:#567988}.edge{stroke:#618c9d;stroke-width:2.2;fill:none;marker-end:url(#a)}@media(prefers-color-scheme:dark){.bg{fill:#06131f}.box{fill:#0b2233;stroke:#34799a}.accent{fill:#0d2e2a;stroke:#69dfbd}.preview{fill:#241d3c;stroke:#b4a8ff}.txt{fill:#e3f6ff}.muted{fill:#91b8ca}.edge{stroke:#78a3b7}}</style><rect class="bg" width="100%" height="100%"/><text x="70" y="70" class="txt title">AgentRoom: shared work for parallel agents</text><text x="70" y="105" class="txt small muted">Participants coordinate claims, messages, and version-aware edits against one shared room; combined work is validated before delivery.</text><rect x="80" y="210" width="210" height="90" class="box" rx="16"/><text x="100" y="245" class="txt label">Agent A</text><text x="100" y="272" class="txt small muted">independent participant</text><rect x="80" y="360" width="210" height="90" class="box" rx="16"/><text x="100" y="395" class="txt label">Agent B</text><text x="100" y="422" class="txt small muted">independent participant</text><rect x="80" y="510" width="210" height="90" class="box" rx="16"/><text x="100" y="545" class="txt label">Agent C</text><text x="100" y="572" class="txt small muted">independent participant</text><rect x="460" y="290" width="300" height="150" class="accent" rx="16"/><text x="480" y="325" class="txt label">Room MCP</text><text x="480" y="352" class="txt small muted">claim · release · state · broadcast · read</text><rect x="920" y="180" width="300" height="110" class="box" rx="16"/><text x="940" y="215" class="txt label">Shared room state</text><text x="940" y="242" class="txt small muted">participants · claims · messages</text><rect x="920" y="380" width="300" height="110" class="preview" rx="16"/><text x="940" y="415" class="txt label">Version-aware edits</text><text x="940" y="442" class="txt small muted">merge concurrent operations</text><rect x="920" y="580" width="300" height="110" class="accent" rx="16"/><text x="940" y="615" class="txt label">Repository validation</text><text x="940" y="642" class="txt small muted">tests · gates · semantic checks</text><path d="M290 255 L460 365" class="edge"/><path d="M290 405 L460 365" class="edge"/><path d="M290 555 L460 365" class="edge"/><path d="M760 340 L920 235" class="edge"/><path d="M760 390 L920 435" class="edge"/><path d="M1070 490 L1070 580" class="edge"/></svg>