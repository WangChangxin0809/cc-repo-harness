<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-label="/assess: evidence to next steps"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#618c9d"/></marker></defs><style>
:root{color-scheme:light dark}.bg{fill:#f7fbfd}.box{fill:#fff;stroke:#6ca6b9;stroke-width:2}.accent{fill:#e8f8f2;stroke:#26906e;stroke-width:2}.warn{fill:#fff6e6;stroke:#c98a19;stroke-width:2}.txt{fill:#183848;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.muted{fill:#567988}.edge{stroke:#618c9d;stroke-width:2.2;fill:none;marker-end:url(#a)}@media(prefers-color-scheme:dark){.bg{fill:#06131f}.box{fill:#0b2233;stroke:#34799a}.accent{fill:#0d2e2a;stroke:#69dfbd}.warn{fill:#332812;stroke:#ffd166}.txt{fill:#e3f6ff}.muted{fill:#91b8ca}.edge{stroke:#78a3b7}}</style><rect class="bg" width="100%" height="100%"/><text x="70" y="70" class="txt title">/assess: evidence to next steps</text><text x="70" y="105" class="txt small muted">Scripted measurements and agent readings stay separate, then converge into actionable findings and remeasurement.</text><rect x="60" y="310" width="190" height="105" class="accent" rx="16"/><text x="80" y="345" class="txt label">Measure</text><text x="80" y="372" class="txt small muted">scripts collect facts</text><rect x="300" y="310" width="190" height="105" class="box" rx="16"/><text x="320" y="345" class="txt label">Answer gaps</text><text x="320" y="372" class="txt small muted">readers inspect repo</text><rect x="540" y="310" width="190" height="105" class="box" rx="16"/><text x="560" y="345" class="txt label">Read twice</text><text x="560" y="372" class="txt small muted">independent scoring</text><rect x="780" y="310" width="190" height="105" class="box" rx="16"/><text x="800" y="345" class="txt label">Prioritize</text><text x="800" y="372" class="txt small muted">what moves the number</text><rect x="1020" y="310" width="190" height="105" class="box" rx="16"/><text x="1040" y="345" class="txt label">Improve</text><text x="1040" y="372" class="txt small muted">change selected rows</text><rect x="1260" y="310" width="190" height="105" class="accent" rx="16"/><text x="1280" y="345" class="txt label">Re-measure</text><text x="1280" y="372" class="txt small muted">compare evidence</text><path d="M250 362 L300 362" class="edge"/><path d="M490 362 L540 362" class="edge"/><path d="M730 362 L780 362" class="edge"/><path d="M970 362 L1020 362" class="edge"/><path d="M1210 362 L1260 362" class="edge"/><rect x="300" y="560" width="280" height="95" class="box" rx="16"/><text x="320" y="595" class="txt label">Five dimensions</text><text x="320" y="622" class="txt small muted">execution · validation · delivery · memory · context</text><rect x="830" y="560" width="300" height="95" class="warn" rx="16"/><text x="850" y="595" class="txt label">Disagreement is visible</text><text x="850" y="622" class="txt small muted">readings &gt;2 points apart stay separate</text></svg>