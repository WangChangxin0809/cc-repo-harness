version: 2

# This repository ships no runtime dependencies, and that claim is enforced by
# running the whole suite on 3.9 and 3.13 with an empty environment. So the
# things here that can rot are all third-party code that runs with access to
# the repository, and each is pinned somewhere a human can read.

updates:
  # Actions are pinned to commit SHAs, which is what makes them immutable and
  # also what makes them invisible: a SHA carries no version, so nothing about
  # a pin going stale is apparent from reading it. Dependabot is what turns each
  # move into a pull request with a diff and a changelog — the reviewable form
  # of the same decision the trust gate asks a human to make locally.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Grouped, because four separate "bump a patch version" pull requests a
    # month is how people learn to merge them without looking, which is the
    # supply-chain failure this file was added to prevent.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # The linters, pinned in .github/requirements-dev.txt. Pinned so that somebody
  # else's release cannot turn a build red on a commit that changed nothing —
  # and watched here so that the pin does not become a version CI proves against
  # that nobody runs.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      linters:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # The agent under test, pinned in eval/agent/package-lock.json. It is not a
  # runtime dependency of anything this plugin installs into a repository -- it
  # is the subject of eval/, downloaded by a workflow that is dispatched by hand.
  # Watched for the reason the linters are: a pin nothing updates becomes a
  # version CI proves against that nobody runs, and an agent frozen a year back
  # would measure the harness against an agent nobody uses.
  - package-ecosystem: npm
    directory: /eval/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
