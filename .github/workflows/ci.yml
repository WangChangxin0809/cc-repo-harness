name: ci

# Fast merge-blocking CI. Keep the model/API-costing behavioral evals out of
# this file: an untrusted pull request must not need a repository secret to earn
# a mergeable result. Expensive/full compatibility lives in postmerge-ci.yml.
#
# The path selector only saves work on pull requests. Every push to main runs
# every blocking lane, so a selector bug cannot leave a main commit unjudged.
# The selector and the final required-context policy are both self-tested.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect CI lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      python: ${{ steps.select.outputs.python }}
      acceptance: ${{ steps.select.outputs.acceptance }}
      preview: ${{ steps.select.outputs.preview }}
      plugin_host: ${{ steps.select.outputs.plugin_host }}
      force_all: ${{ steps.select.outputs.force_all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: classify the actual merge-base diff
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/select_ci.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  python-compat:
    name: Python ${{ matrix.python }}
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Fast PR boundary: oldest supported and latest stable. postmerge-ci
        # covers every supported minor between them.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: guards can still turn red
        run: python3 shared/scripts/guards/selftest.py
      - name: gates can still turn red
        run: python3 shared/scripts/gates/selftest.py --verbose
      - name: context hooks still reach the model
        run: python3 shared/scripts/context/selftest.py --verbose
      - name: repo graph still says what it claims
        run: python3 shared/scripts/index/selftest.py --verbose
      - name: assessment still distinguishes good and bad repositories
        run: python3 shared/scripts/assess/selftest.py --verbose
      - name: AgentRoom coordination preview still holds
        run: python3 shared/optional/agentroom/selftest.py
      - name: AgentRoom installer preview still holds
        run: python3 shared/optional/agentroom/install_selftest.py
      - name: WikiSkill evolution preview still holds
        run: python3 shared/optional/wikiskill/selftest.py
      - name: concurrency assessment preview stays evidence-scoped
        run: python3 shared/scripts/assess/concurrency_selftest.py
      - name: nothing runs until it is trusted
        run: python3 hooks/selftest.py --verbose
      - name: machine-path gate can still turn red
        run: python3 shared/scripts/gates/check_no_machine_paths.py --selftest
      - name: plugin checker can still turn red
        run: python3 shared/scripts/check_plugin_structure.py --selftest --verbose
      - name: drift pass distinguishes a suspect from a quiet pair
        run: python3 shared/scripts/drift.py selftest --verbose
      - name: extractor distinguishes a refusal from prose
        run: python3 shared/scripts/wiki/extract.py --selftest --verbose
      - name: replay names the legitimate call a wrong guard would break
        run: python3 shared/scripts/wiki/replay.py --selftest --verbose
      - name: template sync can still see a partial copy
        run: python3 scripts/sync_template.py --selftest --verbose

  surface:
    name: Repository and plugin surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: no unfilled templates
        run: python3 shared/scripts/gates/check_templates_filled.py --root .
      - name: public face intact
        run: python3 shared/scripts/gates/check_community_health.py --root .
      - name: wired hook commands resolve from any working directory
        run: python3 shared/scripts/gates/check_hook_paths.py --root .
      - name: docs routing table resolves
        run: python3 shared/scripts/gates/check_docs_index.py --root .
      - name: files stay inside the agent-readable ceiling
        run: python3 shared/scripts/gates/check_file_size.py --root .
      - name: nobody's home directory is committed
        run: python3 shared/scripts/gates/check_no_machine_paths.py --root .
      - name: wiki stays a record
        run: python3 shared/scripts/gates/check_wiki_hygiene.py --root .
      - name: documented commands resolve
        run: python3 shared/scripts/gates/check_docs_runnable.py --root .
      - name: plugin surface stays within its standing-context budget
        run: python3 shared/scripts/check_plugin_structure.py --root . --always-on-cap 171
      - name: CI lane selector can still turn every required lane on
        run: python3 .github/scripts/select_ci.py --self-test
      - name: stable required context rejects skipped selected work
        run: python3 .github/scripts/check_ci_results.py --self-test
      - name: local runner can still read the workflow
        run: python3 scripts/check.py --selftest

  acceptance:
    name: Scaffold acceptance
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.acceptance == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: scaffold reaches green and outlives the plugin
        run: python3 shared/scripts/selftest.py --verbose

  preview-native:
    name: AgentRoom native MCP / CRDT
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.preview == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: install the pinned optional native runtime
        run: python3 -m pip install -r shared/optional/agentroom/requirements.txt
      - name: official MCP SDK and pycrdt interoperate
        env:
          NATIVE_AGENTROOM: "1"
        run: python3 shared/optional/agentroom/protocol_selftest.py

  plugin-host:
    name: Claude Code host validation
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.plugin_host == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: eval/agent/package-lock.json
      - name: install the pinned Claude Code under test
        run: npm ci --prefix eval/agent --no-audit --no-fund
      - name: the real Claude Code host accepts this plugin
        env:
          CLAUDE_BIN: eval/agent/node_modules/.bin/claude
        run: '"$CLAUDE_BIN" plugin validate . --strict'
      - name: the pinned host exposes native plugin evals
        env:
          CLAUDE_BIN: eval/agent/node_modules/.bin/claude
        run: '"$CLAUDE_BIN" plugin eval --help'

  hygiene:
    name: Workflow and Python hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: install the linters
        run: |
          for attempt in 1 2 3; do
            python3 -m pip install -r .github/requirements-dev.txt && exit 0
            echo "::warning::pip install failed on attempt $attempt of 3"
            sleep 15
          done
          exit 1
      - name: workflows are valid
        run: actionlint
      - name: workflows are not a supply-chain hole
        run: zizmor --no-progress .github/workflows/
      - name: Python says what it means
        run: ruff check .

  release-hygiene:
    name: Release hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: version check can still turn red
        run: python3 .github/scripts/check_version_bumped.py --self-test --verbose
      - name: release tagger can still turn red
        run: python3 .github/scripts/release_tag.py --self-test --verbose
      - name: a shipped change raises the plugin version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EXEMPT: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'no-version-bump')
                || github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "$EXEMPT" = "true" ]; then
            echo "exempt: labelled no-version-bump, or opened by Dependabot"
            exit 0
          fi
          python3 .github/scripts/check_version_bumped.py --base-ref "$BASE"

  # Transitional compatibility contexts for the repository's existing
  # classic branch protection. They do not rerun checks; each mirrors the one
  # version-controlled terminal gate above. Once branch protection requires
  # only "CI required", delete these five jobs.
  legacy-checks-39:
    name: checks (3.9)
    if: always()
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success

  legacy-checks-313:
    name: checks (3.13)
    if: always()
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success

  legacy-acceptance:
    name: acceptance
    if: always()
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success

  legacy-hygiene:
    name: hygiene
    if: always()
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success

  legacy-release-hygiene:
    name: release-hygiene
    if: always()
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success

  required:
    name: CI required
    if: always()
    needs:
      - changes
      - python-compat
      - surface
      - acceptance
      - preview-native
      - plugin-host
      - hygiene
      - release-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: require every selected dependency to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_PYTHON: ${{ needs.changes.outputs.python }}
          RUN_ACCEPTANCE: ${{ needs.changes.outputs.acceptance }}
          RUN_PREVIEW: ${{ needs.changes.outputs.preview }}
          RUN_PLUGIN_HOST: ${{ needs.changes.outputs.plugin_host }}
        run: python3 .github/scripts/check_ci_results.py
