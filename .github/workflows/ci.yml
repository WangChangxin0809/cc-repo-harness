name: ci

# The server-side half of what this plugin tells everyone else to build. Its
# own README calls a check that only runs on a laptop the weakest of the three
# layers, and until this file existed that was exactly what this repository
# had: a ci.sh nobody was obliged to run.
#
# Exit 2 means "could not judge" and is never a pass. Nothing special is needed
# to honour that here -- any non-zero exit fails the step -- but it is the
# reason no step is allowed to swallow a status with `|| true`.
#
# Every step is one line invoking a script, and that is the same rule
# moments.md states for .claude/settings.json rather than a style preference.
# Judgement written into a CI wiring cannot be run before pushing, cannot be
# tested, and dies with the provider.
#
# No path filters, deliberately. A docs-only change is exactly what breaks the
# routing table and check_docs_runnable.py, so "skip CI for docs" would skip
# the checks most likely to catch it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a pull request are cancelled. Pushes to main are not:
  # main's history is what every later bisect is measured against, and a
  # cancelled run leaves a commit nobody ever judged sitting in it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    # The whole job is about five seconds. Anything approaching ten minutes has
    # hung, and the default six-hour ceiling turns a hang into a queue nobody
    # notices until someone asks why CI is slow.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The README claims Python 3.9+ with no dependencies. A claim about a
        # version nobody runs is a claim, not a fact -- so run the floor and
        # the ceiling, and let the matrix be the thing that keeps it true.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # checkout leaves the job's token in .git/config unless told not to,
          # where every later step -- and anything a later step runs -- can read
          # it. zizmor calls this `artipacked`. Nothing here needs to push.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: guards can still turn red
        run: python3 shared/scripts/guards/selftest.py

      - name: gates can still turn red
        run: python3 shared/scripts/gates/selftest.py --verbose

      # The index is the one component whose defects are invisible: a broken
      # gate turns red, a broken guard fails open and its selftest catches it,
      # but a graph that ranks the wrong file returns a confident wrong answer
      # nobody checks. It shipped without a selftest; these are the defects
      # that were in it.
      - name: the repo graph still says what it claims
        run: python3 shared/scripts/index/selftest.py --verbose

      # The trust gate decides whether an unread repository's code executes on
      # someone's machine. It is the only component here that fails silently
      # and in the safe-looking direction: a check that wrongly concludes
      # "trusted" produces no error, no output and no symptom until the
      # repository it waved through was hostile. It shipped with no test.
      - name: nothing runs until it is trusted
        run: python3 hooks/selftest.py --verbose

      # The shipped gates, turned on this repository. This is the step that
      # would have caught the defect that motivated writing check_templates_
      # filled.py in the first place: a scaffolder whose own output no gate
      # here could see.
      - name: no unfilled templates
        run: python3 shared/scripts/gates/check_templates_filled.py --root .

      - name: public face intact
        run: python3 shared/scripts/gates/check_community_health.py --root .

      - name: docs routing table resolves
        run: python3 shared/scripts/gates/check_docs_index.py --root .

      # The gate that found four shipped commands in this repository's own
      # skills that exited with `unrecognized arguments`. Documentation is the
      # one artefact here that nobody ever executes, which is why it drifts
      # first and silently.
      - name: documented commands would run
        run: python3 shared/scripts/gates/check_docs_runnable.py --root .

      # Every step above this line judges the payload -- the files this plugin
      # copies into somebody else's repository. None of them judge the plugin:
      # `.claude-plugin/`, `skills/`, `agents/`, `hooks/hooks.json` are what
      # Claude Code actually loads, and they had no coverage at all. The gap
      # was not carelessness. Payload is code, and code gets a selftest; a
      # skill is markdown, and nobody writes a test for a paragraph.
      #
      # What was sitting in the gap: ten commands across four skills telling an
      # agent to run `python3 <plugin>/shared/scripts/scaffold.py`, against a
      # placeholder this repository invented and nothing resolves.
      - name: the plugin surface itself holds
        run: python3 shared/scripts/gates/check_plugin_structure.py --root .

      # The other half of drift needs judgement and cannot be a gate. What can
      # be checked is the tool that prepares the judgement: that its git triage
      # points the right way, that `Governs:` matches by segment here too, and
      # that an unreviewed packet cannot come back clean.
      - name: the drift pass can still tell a suspect from a quiet pair
        run: python3 shared/scripts/drift.py selftest --verbose

  acceptance:
    # The plugin's own acceptance criterion, the one the README states in prose:
    # scaffold a repository, fill in what the red list names, delete the plugin,
    # and the repository must still stand on its own.
    #
    # Every step in `checks` runs with the plugin sitting right there on disk,
    # so none of them can tell a repository that stands alone from one quietly
    # reaching back into the checkout it was scaffolded from. That difference is
    # invisible to whoever ran the scaffolder and total for the teammate who
    # clones afterwards.
    #
    # Its own job because it is the slow one -- about thirteen seconds of
    # scaffolding and copying against five for everything else -- and because
    # "the scaffolder broke" and "a gate broke" deserve two different red
    # squares.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: the scaffold reaches green, and outlives the plugin
        run: python3 shared/scripts/selftest.py --verbose

  hygiene:
    # Three linters, and the reason they are here rather than in a contributing
    # note is the repository's own rule: what cannot tolerate a miss does not go
    # through a paragraph hoping to be read.
    #
    # zizmor is the one that earned its place immediately. Run against this file
    # before it existed, it found ten: seven unpinned actions, and three
    # checkouts leaving the job's token in .git/config. Both were written by
    # somebody who had read the security section of this repository's own README
    # that morning, which is the whole argument for a check over a convention.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Pinned in a requirements file rather than inline, so Dependabot can see
      # them. A version written into YAML is one nothing updates.
      - name: install the linters
        run: python3 -m pip install -r .github/requirements-dev.txt

      # Syntax, expression typing, and shellcheck over every `run:` block. It
      # was already clean when introduced; that is the point of adding it before
      # anything is wrong rather than after.
      - name: workflows are valid
        # The console script, not `python3 -m actionlint`: actionlint-py wheels
        # a Go binary and installs an entry point, there is no importable
        # module. The `-m` form was written here, verified nowhere, and failed
        # on the first run of the job it was added in.
        run: actionlint

      # Supply chain. A tag is mutable, so an action referenced by tag is a
      # promise from whoever can move it; the SHA pins are what this enforces.
      - name: workflows are not a supply-chain hole
        run: zizmor --no-progress .github/workflows/

      # Lint only -- see ruff.toml for why there is no formatter, and for what
      # was deliberately not selected. It found two real defects on first run.
      - name: the Python says what it means
        run: ruff check .

  release-hygiene:
    # Only on a pull request: there is nothing to diff a push to main against,
    # and a check that quietly does nothing on half its triggers is worse than
    # one that is absent, because the green square says it ran.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The check diffs against the merge base. A shallow clone has none,
          # and the script exits 2 rather than guessing.
          fetch-depth: 0

      # First, deliberately. A validator that has stopped detecting its target
      # reports a clean build forever, and that is precisely the failure this
      # repository was built to talk about.
      - name: the version check can still turn red
        run: python3 .github/scripts/check_version_bumped.py --self-test --verbose

      - name: a change that ships something raises the version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # A pull request labelled `no-version-bump` is an explicit statement
          # that this ships nothing, made in public on the pull request. That is
          # a different thing from forgetting, which is what this catches.
          EXEMPT: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'no-version-bump')
                || github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "$EXEMPT" = "true" ]; then
            echo "exempt: labelled no-version-bump, or opened by Dependabot"
            exit 0
          fi
          python3 .github/scripts/check_version_bumped.py --base-ref "$BASE"
